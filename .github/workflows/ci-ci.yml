name: Ci/Cd Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: nesrux/admin-do-catalogo

jobs:
  # Job para a execução dos testes
  tests:
    name: Tests runner
    runs-on: ubuntu-latest
    # Configuração de passos do nosso job
    steps:
      # 1. Check-out do código fonte
      - uses: actions/checkout@v3
      # 2. Configurar a JDK na máquina
      - name: Set up JDK@17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
      # 3. Coloca o ./gradlw como executavel
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      # 3. Executar os testes da aplicação
      - name: Run application tests
        run: ./gradlew test

  #1. Job para buildar a aplicaço
  build:
    name: Build runner
    needs: tests
    runs-on: ubuntu-latest
    #Configuração de passos do job
    steps:
      - uses: actions/checkout@v3
      #2.Faz o setup do Java no ubuntu
      - name: Set up JDK@17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'

        # 3. Valida a existência do gradle wrapper
      - name: Validate gradle wrapper
        uses: gradle/wrapper-validation-action@v3
      # 4. Build a aplicação
      - name: Build da aplicação
        uses: gradle/gradle-build-action@v3
        with:
          arguments: clean build -x test
      # 5. Definir a variavel branch name
      - name: Set BUILD_TAG
        run: |
          echo BUILD_TAG=$(echo ${{ github.head_ref || github.ref_name }} | sed "s,/,_,g")-${{ github.run_number }} >> $GITHUB_ENV
      # 6. Print BUILD_TAG
      - name: Print BUILD_TAG defined
        run: |
          echo "Branch     ---> ${{ github.head_ref || github.ref_name }}"
          echo "Run number ---> ${{ github.run_number }}"
          echo "Tag        ---> ${{ env.BUILD_TAG }}"
      # 7. Log in to DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_KEY }}
      # 8. Build & Deploy da imagem
      - name: Build & push da imagem do docker
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          build-args: VERSION=${{ env.BUILD_TAG }}
          tags: ${{ env.IMAGE_NAME }}:${{ env.BUILD_TAG }}
