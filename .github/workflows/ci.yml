name: CI Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  #Job para a execução dos testes
  tests:
    name: Test runner
    runs-on: ubuntu-Latest
    steps:
       # 1. checkout do código fonte
      -  uses: actions/checkout@v3
      # 2. configura a Jdk na maquina
      -  name :  Set up Jdk 17
         uses: actions/setup-java@v3
         with:
           java-version: '17'
           distribution: 'adopt'
        # 3. Executa os testes da aplicação
      - name: run application tests
        run: ./gradlew test

